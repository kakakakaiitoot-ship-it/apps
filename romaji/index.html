*{box-sizing:border-box}
body{
  margin:0;background:var(--pale);color:var(--navy);
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  height:100vh;display:flex;flex-direction:column;overflow:hidden;
}
header{background:var(--navy);color:#fff;padding:12px 16px;flex:0 0 auto}
header h1{margin:0;font-size:17px;letter-spacing:.04em}
header p{margin:4px 0 0;font-size:12px;color:#A9C4E6}
header .back{float:right;font-size:13px;font-weight:700;color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.6);border-radius:8px;padding:2px 8px}
@media print{header .back{display:none}}
/* ===== 左右2分割レイアウト ===== */
.app-container{display:flex;flex:1 1 auto;min-height:0;overflow:hidden}
.panel{flex:0 0 380px;width:380px;padding:16px;overflow-y:auto;
  background:rgba(255,255,255,.4);border-right:1px solid rgba(27,63,107,.15)}
.preview-pane{flex:1 1 auto;min-width:0;overflow:auto;padding:16px;
  display:flex;justify-content:center;align-items:flex-start;background:var(--pale)}
.row{margin-bottom:14px}
.row > span.lbl{display:block;font-size:12px;color:var(--blue-d);margin-bottom:6px;font-weight:700}
.btns{display:flex;flex-wrap:wrap;gap:6px}
button.chip{
  border:1.5px solid var(--rule);background:var(--paper);color:var(--navy);
  border-radius:8px;padding:7px 11px;font-size:14px;cursor:pointer;
  font-family:inherit;min-width:40px;
}
button.chip.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
button.chip:focus-visible{outline:3px solid #F2B705;outline-offset:2px}
.go{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
button.main{
  flex:1 1 140px;border:none;border-radius:10px;padding:12px;font-size:15px;
  font-weight:700;background:var(--blue);color:#fff;cursor:pointer;font-family:inherit;
}
button.sub{flex:1 1 90px;background:var(--paper);color:var(--blue-d);border:1.5px solid var(--blue);}
.note{font-size:12px;color:#B4551E;margin-top:10px;min-height:1em}

/* ===== 紙面 ===== */
#stage{margin:0 auto;max-width:100%;overflow:visible}
/* 高さを用紙1枚ぶんに固定し、縦の flex で「ヘッダー＋問題エリア＋脚注」に分ける。
   問題エリアが残り全部を取るので、行の高さを px で見積もる必要がなくなる＝はみ出せない */
#paper{position:relative;background:var(--paper);padding:6mm 8mm;width:210mm;height:297mm;
  display:flex;flex-direction:column;overflow:hidden;
  transform-origin:top left;box-shadow:0 4px 16px rgba(16,36,63,.18);
  font-size:14px;   /* 紙面の基準。ヘッダー類はこれに対する em で書く */
  --gap:3px; --noz:22px; --kanaF:17px; --romaF:19px; --cellz:34px;
  --nmW:115mm; --nmH:9mm; --nmFl:13mm}
.ph{flex:0 0 auto;display:flex;align-items:flex-end;gap:10px;border-bottom:2px solid var(--navy);
  padding-bottom:10px;margin-bottom:5px;break-inside:avoid}
/* 見出しと範囲は左に縦積み。範囲は折り返さず、はみ出す分は … で省略する。
   こうしないと画面幅で折り返して見出しの高さが変わり、印刷でページが割れる */
.ph .ttl{flex:1 1 auto;min-width:0}
.ph h2{margin:0;font-size:1.15em;white-space:nowrap}
.ph .scope{font-size:.79em;color:var(--blue-d);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .nm{flex:0 0 min(var(--nmW), calc(100% - 60mm))}   /* 見出し側に最低60mm残す */
.ph .nm .fl{height:var(--nmFl)}
.nmrow{display:flex;align-items:center;gap:5px}
.nmrow+.nmrow{margin-top:10px}
.nmrow .cap{flex:0 0 4.2em;font-size:.79em;color:var(--blue-d);white-space:nowrap}
.nmjp{flex:1 1 auto;height:var(--nmH);border-bottom:1.5px solid var(--navy)}
.ph .nm{padding-bottom:2px}
.ph .nm .cap{font-size:.79em;color:var(--blue-d)}
.meta{display:flex;gap:.6em;font-size:.79em;margin-bottom:4px;flex:0 0 auto;break-inside:avoid}
.meta div{border:1px solid var(--rule);border-radius:4px;padding:2px .7em}

/* 行は repeat(n,1fr) の均等割り付け（JSが行数だけ指定する）。
   親の高さが決まっているので、何問でも縦にはみ出さない */
.grid{flex:1 1 auto;min-height:0;overflow:hidden;display:grid;gap:var(--gap) .7em}
.grid.c2{grid-template-columns:1fr 1fr}
.grid.c3{grid-template-columns:repeat(3,1fr)}
.grid.c1{grid-template-columns:1fr}
/* 1問＝1段。段の高さいっぱいを使う */
.q{display:flex;align-items:center;gap:.45em;padding-right:.3em;height:100%;min-height:0;min-width:0;
  overflow:hidden;break-inside:avoid;page-break-inside:avoid}
.no{flex:0 0 var(--noz);height:var(--noz);border-radius:50%;border:1.5px solid var(--navy);
  display:flex;align-items:center;justify-content:center;font-size:calc(var(--noz)*.5);font-weight:700}
.kana{font-size:var(--kanaF);flex:0 0 auto;min-width:calc(var(--kanaN,5.6)*1em);white-space:nowrap}
.roma{font-family:var(--roma-font);font-size:var(--romaF);flex:0 0 auto;
  min-width:calc(var(--romaN,9)*.62em);
  letter-spacing:.04em;white-space:nowrap}
.cells{display:flex;gap:.2em;flex:0 0 auto}
.cell{width:var(--cellz);height:var(--cellz);border:1.2px solid var(--rule);border-radius:2px}

/* 4線：高さは --flh で固定、横だけ伸びる。折り返しは起こらない。
   線は「枠線」で描く。背景（linear-gradient）で描くと、Chromeの印刷設定
   「背景のグラフィック」がオフのとき4線だけ印刷されない */
.fl{position:relative;flex:1 1 auto;min-width:0;height:86%;overflow:hidden}
.fl > i{position:absolute;left:0;right:0;height:0;border-top:1.2px solid var(--rule)}
.fl > i.b{top:25%}
.fl > i.c{top:75%;margin-top:-2px;border-top-width:2px;border-top-color:var(--base)}
.fl > i.d{top:auto;bottom:0;border-top:0;border-bottom:1px solid var(--rule)}
.fl > svg{position:absolute;left:0;top:0;height:100%;width:auto;display:block}
/* SVG の presentation attribute は var() を解釈しないので、CSS 側で指定する */
.fl > svg text{font-family:var(--roma-font)}
.ans{font-family:var(--roma-font);color:var(--base);font-size:17px}
.alt{font-family:var(--roma-font);font-size:calc(var(--kanaF)*.56);color:#6B87A8;flex:0 1 auto;min-width:0;
  white-space:nowrap;overflow:hidden}
.q > .fl{flex:1 1 auto}
.rule{margin-top:5px;padding:4px 8px;flex:0 0 auto;border:1px solid var(--rule);border-radius:4px;break-inside:avoid;
  font-size:.79em;color:var(--blue-d);background:var(--pale)}
.foot{margin-top:4px;font-size:.71em;color:#5E7A99;text-align:right;flex:0 0 auto;break-inside:avoid}

/* 画面幅が狭い端末は縦並びに戻す */
@media (max-width:860px){
  body{height:auto;overflow:visible}
  .app-container{flex-direction:column}
  .panel{flex:0 0 auto;width:100%;border-right:none;border-bottom:1px solid rgba(27,63,107,.15)}
}

@media print{
  body{background:#fff;height:100%;overflow:visible;display:block}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  header,.panel{display:none!important}
  .app-container{display:block;height:100%;overflow:visible}
  .preview-pane{display:block;height:100%;padding:0;overflow:visible;background:transparent}
  /* applyPaper() が width/min-height をインラインで書くので、印刷では !important で打ち消す。
     これを外すと用紙が210mm＋余白24mmになり、必ず2ページに割れる */
  /* 画面用の縮小表示（インラインの width/height）を印刷では必ず打ち消す。
     残っていると、その箱の大きさのせいだけでページが割れる */
  #stage{margin:0;overflow:hidden;width:auto!important;height:100%!important;max-width:none}
  /* 高さを mm で固定すると、印刷ダイアログの「倍率」を上げられたときに必ず割れる。
     倍率は CSS からは読めないので、mm ではなく「ページの高さの100%」で指定する。
     こうすると倍率が何%でも、紙面はつねに1ページぶんちょうどになる */
  html,body{height:100%}
  /* 印刷ダイアログの「倍率」は CSS から読めない。px や mm のままだと倍率ぶん
     だけ大きく出てはみ出すので、印刷時だけ vh / vw 指定に切り替える */
  /* JS がインラインで px を書いているので、!important でないと上書きできない */
  #paper{font-size:var(--baseP)!important;
    --gap:var(--gapP)!important; --noz:var(--nozP)!important;
    --kanaF:var(--kanaFP)!important; --romaF:var(--romaFP)!important;
    --cellz:var(--cellzP)!important; --nmW:var(--nmWP)!important;
    --nmH:var(--nmHP)!important; --nmFl:var(--nmFlP)!important}
  #paper{box-shadow:none;margin:0;padding:0;width:auto!important;
         height:100%!important;max-height:100%!important;overflow:hidden;
         transform:none!important;break-inside:avoid;page-break-inside:avoid}
  /* 1問の途中で改ページしない */
  .q,.ph,.meta,.rule,.foot,.cell,.fl{break-inside:avoid;page-break-inside:avoid}
}
</style>
<style id="pagecss">@page{size:A4 portrait;margin:6mm 8mm}</style>

<script>
/* ============ かな → ローマ字 変換（APIなし） ============ */
/* [訓令式, ヘボン式] */
const T = {
 'あ':['a','a'],'い':['i','i'],'う':['u','u'],'え':['e','e'],'お':['o','o'],
 'か':['ka','ka'],'き':['ki','ki'],'く':['ku','ku'],'け':['ke','ke'],'こ':['ko','ko'],
 'さ':['sa','sa'],'し':['si','shi'],'す':['su','su'],'せ':['se','se'],'そ':['so','so'],
 'た':['ta','ta'],'ち':['ti','chi'],'つ':['tu','tsu'],'て':['te','te'],'と':['to','to'],
 'な':['na','na'],'に':['ni','ni'],'ぬ':['nu','nu'],'ね':['ne','ne'],'の':['no','no'],
 'は':['ha','ha'],'ひ':['hi','hi'],'ふ':['hu','fu'],'へ':['he','he'],'ほ':['ho','ho'],
 'ま':['ma','ma'],'み':['mi','mi'],'む':['mu','mu'],'め':['me','me'],'も':['mo','mo'],
 'や':['ya','ya'],'ゆ':['yu','yu'],'よ':['yo','yo'],
 'ら':['ra','ra'],'り':['ri','ri'],'る':['ru','ru'],'れ':['re','re'],'ろ':['ro','ro'],
 'わ':['wa','wa'],'を':['wo','o'],
 'が':['ga','ga'],'ぎ':['gi','gi'],'ぐ':['gu','gu'],'げ':['ge','ge'],'ご':['go','go'],
 'ざ':['za','za'],'じ':['zi','ji'],'ず':['zu','zu'],'ぜ':['ze','ze'],'ぞ':['zo','zo'],
 'だ':['da','da'],'ぢ':['di','ji'],'づ':['du','zu'],'で':['de','de'],'ど':['do','do'],
 'ば':['ba','ba'],'び':['bi','bi'],'ぶ':['bu','bu'],'べ':['be','be'],'ぼ':['bo','bo'],
 'ぱ':['pa','pa'],'ぴ':['pi','pi'],'ぷ':['pu','pu'],'ぺ':['pe','pe'],'ぽ':['po','po'],
 'きゃ':['kya','kya'],'きゅ':['kyu','kyu'],'きょ':['kyo','kyo'],
 'しゃ':['sya','sha'],'しゅ':['syu','shu'],'しょ':['syo','sho'],
 'ちゃ':['tya','cha'],'ちゅ':['tyu','chu'],'ちょ':['tyo','cho'],
 'にゃ':['nya','nya'],'にゅ':['nyu','nyu'],'にょ':['nyo','nyo'],
 'ひゃ':['hya','hya'],'ひゅ':['hyu','hyu'],'ひょ':['hyo','hyo'],
 'みゃ':['mya','mya'],'みゅ':['myu','myu'],'みょ':['myo','myo'],
 'りゃ':['rya','rya'],'りゅ':['ryu','ryu'],'りょ':['ryo','ryo'],
 'ぎゃ':['gya','gya'],'ぎゅ':['gyu','gyu'],'ぎょ':['gyo','gyo'],
 'じゃ':['zya','ja'],'じゅ':['zyu','ju'],'じょ':['zyo','jo'],
 'びゃ':['bya','bya'],'びゅ':['byu','byu'],'びょ':['byo','byo'],
 'ぴゃ':['pya','pya'],'ぴゅ':['pyu','pyu'],'ぴょ':['pyo','pyo']
};
const LONG = {k:{a:'â',i:'î',u:'û',e:'ê',o:'ô'}, h:{a:'ā',i:'ī',u:'ū',e:'ē',o:'ō'}};
const VOW = {'あ':'a','い':'i','う':'u','え':'e','お':'o'};

function tokenize(kana){
  const out=[];
  for(let i=0;i<kana.length;i++){
    const two=kana.substr(i,2);
    if(T[two]){out.push(two);i++;}
    else out.push(kana[i]);
  }
  return out;
}
function toRomaji(kana, hepburn){
  const idx = hepburn?1:0, lg = hepburn?LONG.h:LONG.k;
  const u = tokenize(kana);
  let out='', sokuon=false;
  for(let i=0;i<u.length;i++){
    const c=u[i];
    if(c==='っ'){sokuon=true;continue;}
    /* 長音：前のモーラの母音と同じ母音字が続くとき */
    if(VOW[c] && out){
      const last=out.slice(-1), v=VOW[c];
      if(last===v || (v==='u' && last==='o')){
        out = out.slice(0,-1) + lg[last==='o'?'o':last];
        continue;
      }
    }
    let r;
    if(c==='ん'){
      const nx = u[i+1];
      let head='';
      if(nx && nx!=='っ' && T[nx]) head = T[nx][idx][0];
      r = (hepburn && head && 'bmp'.includes(head)) ? 'm' : 'n';
      if(head && ('aiueoy'.includes(head))) r += "'";
    }else{
      if(!T[c]) continue;
      r = T[c][idx];
    }
    if(sokuon){ r = (r.startsWith('ch') ? 't' : r[0]) + r; sokuon=false; }
    out += r;
  }
  return out;
}

/* ============ 語いリスト（かなだけ／内蔵） ============ */
const WORDS = [
 'あい','あう','あお','あおい','いえ','うえ','うお','おい','おおい','いいえ',
 'あか','あかい','あき','あく','いか','いく','いけ','えき','おか','おく',
 'かい','かお','かき','かく','きく','くき','けいこ','こい','こえ','こけ',
 'かいこ','きかい','きおく','かこ','こおり','くうき','いこう','おおきい','あさ','あさい',
 'あし','あす','あせ','いし','いす','いそ','うし','うす','うすい','うそ',
 'えさ','おす','しお','すし','しあい','すあし','さす','さい','うしお','さそい',
 'あいす','すいえい','さしえ','すいか','せき','そこ','さけ','あと','いと','うた',
 'おと','たい','たつ','たて','ちち','ちえ','つち','つた','つつ','てあて',
 'てつ','あいて','あつい','いたい','いたち','おとうと','ついたち','たこ','たけ','つき',
 'した','そと','くつ','かた','とし','あな','あね','いぬ','いね','うに',
 'おに','おの','なえ','なに','ぬう','にあう','ぬの','なし','にく','ねこ',
 'かに','さかな','なつ','なす','にし','はい','はえ','はは','ひえ','ひふ',
 'ふえ','へい','ほお','ほほ','ふうふ','ほのお','ひかり','はな','ひと','ふね',
 'へや','ほし','はこ','ふく','あひる','はし','はた','あま','いま','うま',
 'うめ','おまえ','まい','まえ','まま','もも','みまい','みみ','うみ','あみ',
 'おうむ','あおな','まち','みせ','むし','もち','あめ','くま','かみ','まめ',
 'いも','おや','いや','よい','あゆ','やおや','ゆうやけ','やま','ゆき','よる',
 'はやし','おやつ','やさい','ゆめ','よこ','つゆ','うら','おり','いろ','るす',
 'れい','あり','あらい','ろうか','りか','れきし','らく','りす','くるま','そら',
 'とり','はしら','さくら','くり','はれ','いわ','わけ','わに','かわ','にわ',
 'わたし','わら','かわら','ほん','みかん','てんき','さんかく','せんせい','にんき','けん',
 'ふんすい','げた','ごま','ざる','じかん','ずかん','かぜ','みず','ひざ','たまご',
 'かぎ','ばす','ぶた','どうぐ','でんわ','だいこん','ぎんこう','ぼうし','べんとう','ぱん',
 'ぴあの','ぺん','ぽけっと','ぷりん','きゃく','きゅうり','きょう','しゃしん','しゅくだい','しょくじ',
 'ちゃわん','ちゅうしゃ','ちょきん','にゅうがく','ひゃく','びょういん','りょうり','じゃがいも','きんぎょ','おちゃ',
 'きって','らっぱ','がっき','いっぱい','しっぽ','にっき','まっち','こっぷ','ざっし','きっぷ',
 'がっこう','おとうさん','おかあさん','おにいさん','そうじ','ゆうき','とうふ','ふうせん','ゆうびん','あいさつ',
 'あかり','あさひ','あしおと','いちご','いのち','うちゅう','うんどう','えいご','えほん','おうさま',
 'おかし','おてら','おんがく','かいだん','かがみ','かたち','きせつ','きのこ','きぼう','きょうしつ',
 'くすり','くだもの','けいさん','げんき','こうえん','こくご','ことば','こども','さいふ','さかみち',
 'さくぶん','さんすう','しあわせ','しずか','しつもん','じてんしゃ','しんぶん','すいどう','すうじ','せいかつ',
 'せんたく','そうだん','たいいく','たいよう','たからもの','たてもの','ちいさい','ちかてつ','ちきゅう','つくえ',
 'つめたい','てがみ','でんしゃ','とけい','ともだち','どうぶつ','なつやすみ','なまえ','にちようび','にほん',
 'にもつ','ねんど','のりもの','はくしゅ','はたけ','はなび','はやい','ひこうき','ふゆ','ぶんぼうぐ',
 'へいわ','べんきょう','ぼうけん','まいにち','まつり','まんが','みずうみ','みどり','むかし','めがね',
 'やきゅう','やさしい','ゆうがた','ようふく','よてい','らいねん','りょこう','れんしゅう','ろうそく','わたあめ',
 'わらう'
];

/* ============ 行の定義と許可文字 ============ */
const ROWS = {
 'あ':'あいうえお','か':'かきくけこ','さ':'さしすせそ','た':'たちつてと',
 'な':'なにぬねの','は':'はひふへほ','ま':'まみむめも','や':'やゆよ',
 'ら':'らりるれろ','わ':'わを','ん':'ん'
};
const DAKU = {'か':'がぎぐげご','さ':'ざじずぜぞ','た':'だぢづでど','は':'ばびぶべぼぱぴぷぺぽ'};
const YOU  = 'ゃゅょ';

/* 用紙：[表示名, 幅mm, 高さmm, テスト時の列数, @page] */
const PAPERS = {
  a4t:['A4 たて',210,297,2,'A4 portrait'],
  b4t:['B4 たて',257,364,2,'B4 portrait'],
  a4y:['A4 よこ',297,210,3,'A4 landscape'],
  a3y:['A3 よこ',420,297,3,'A3 landscape']
};

const state = {
  rows:new Set(['あ','か','さ','た','な','は','ま','や','ら','わ','ん']),
  daku:true, you:true, soku:true,
  kind:'both', count:50, hepburn:false, /* 訓令式に固定（切替UIなし） */ level:'normal', paper:'a4t',
  items:[]
};
function applyPaper(){
  const p = PAPERS[state.paper], el = document.getElementById('paper');
  el.style.width = p[1]+'mm';
  el.style.height = p[2]+'mm';
  el.style.setProperty('--pgh', p[2]+'mm');
  document.getElementById('pagecss').textContent = `@page{size:${p[1]}mm ${p[2]}mm;margin:6mm 8mm}`;
}
/* 画面が狭いときは、紙面を「縮小表示」する（幅を詰めるのではなく）。
   幅を詰めると画面と印刷で行の折り返しが変わり、印刷だけ2枚になる */
function scaleView(){
  const paper=document.getElementById('paper'), stage=document.getElementById('stage');
  const preview=document.getElementById('previewPane');
  if(!paper||!preview) return;
  const availW=preview.clientWidth-32, availH=preview.clientHeight-32;
  const rowLayout=window.innerWidth>860;
  const k=rowLayout ? Math.min(1, availW/paper.offsetWidth, availH/paper.offsetHeight)
                    : Math.min(1, availW/paper.offsetWidth);
  paper.style.transform = k<1 ? `scale(${k})` : 'none';
  stage.style.width  = Math.round(paper.offsetWidth*k)+'px';
  stage.style.height = Math.round(paper.offsetHeight*k)+'px';
}

function allowedChars(){
  let s='';
  state.rows.forEach(r=>{ s+=ROWS[r]; if(state.daku && DAKU[r]) s+=DAKU[r]; });
  if(state.you) s+=YOU;
  if(state.soku) s+='っ';
  return new Set(s.split(''));
}
function pool(){
  const ok = allowedChars();
  return WORDS.filter(w=>[...w].every(c=>ok.has(c)));
}
function pick(n){
  const p = pool();
  if(!p.length) return [];
  const out=[];
  while(out.length < n){                 /* 語が足りないときは、毎周シャッフルし直して補充する */
    const s = p.slice();
    for(let i=s.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[s[i],s[j]]=[s[j],s[i]];}
    out.push(...s);
  }
  return out.slice(0,n);
}

/* ============ 4線 ============ */
/* 線は .fl の背景（高さ固定・幅だけ可変）、文字だけSVG。
   SVGは height:100% / width:auto なので、行の高さにだけ比例して拡大縮小する。 */
function fourLine(text, mode){
  if(!text) mode='blank';
  const show = mode==='answer' ? text
             : mode==='trace'  ? text
             : mode==='first'  ? text[0] : '';
  const fill = mode==='answer' ? 'var(--base)' : 'var(--faint)';
  /* font-family は CSS（.fl > svg text）で当てる。属性に var() は書けない */
  const t = show ? `<text x="10" y="36" font-size="42"`
                 + ` letter-spacing="1" fill="${fill}">${show}</text>` : '';
  const lines='<i class="a"></i><i class="b"></i><i class="c"></i><i class="d"></i>';
  return `<div class="fl">${lines}${t?`<svg viewBox="0 0 300 48" preserveAspectRatio="xMinYMid meet">${t}</svg>`:''}</div>`;
}

/* 1mm が何pxか（用紙の高さから1ページに入る行の高さを逆算するのに使う） */
const MM = (()=>{
  const d=document.createElement('div');
  d.style.cssText='position:absolute;visibility:hidden;width:100mm';
  document.body.appendChild(d); const v=d.offsetWidth/100; d.remove(); return v;
})();

/* 語が長くて4線に収まらないときは、字を小さくして収める。
   ベースライン（3本目の線）の位置は変えないので、線からは外れない。 */
function squeeze(){
  document.querySelectorAll('#paper .fl').forEach(fl=>{
    const t=fl.querySelector('text'); if(!t) return;
    t.setAttribute('font-size',42);
    const h=fl.clientHeight; if(!h) return;
    const avail=(fl.clientWidth/(h/48))-14;      /* viewBox単位に直した使える幅 */
    const w=t.getComputedTextLength();
    if(w>avail && avail>20) t.setAttribute('font-size', Math.max(16, 42*avail/w));
  });
}

/* 行は grid の 1fr 均等割り付けなので、縦にはみ出すことは構造上ありえない。
   ここでやるのは「決まった段の高さ」に合わせて字とマスの大きさを決めることだけ */
function fit(){
  const paper=document.getElementById('paper'), grid=paper.querySelector('.grid');
  if(!grid) return true;
  const cols=+grid.dataset.cols||1;
  const lines=Math.ceil(state.count/cols);
  const gap=3, CAP=150;                 /* 段が大きくなりすぎないための上限 */
  grid.style.gridTemplateRows=`repeat(${lines},1fr)`;
  grid.style.alignContent='stretch';
  let track=(grid.clientHeight-gap*(lines-1))/lines;
  if(track>CAP){                        /* 問題が少ないときは上限で止めて上詰め */
    grid.style.gridTemplateRows=`repeat(${lines},${CAP}px)`;
    grid.style.alignContent='start';
    track=CAP;
  }

  const st=paper.style, cl=(v,lo,hi)=>Math.round(Math.max(lo,Math.min(v,hi)));
  const maxn=+grid.dataset.maxn||4, maxr=+grid.dataset.maxr||9, maxk=+grid.dataset.maxk||5;
  const colW=(grid.clientWidth-10*(cols-1))/cols;
  const noz=cl(track*0.46,14,30);
  /* 語が長いと、かな／ローマ字が列幅を食いつぶしてマスがはみ出す。
     いちばん長い語が列幅の45%に収まるところまで字を小さくする */
  const romaF=Math.max(10,Math.min(cl(track*0.46,12,38), Math.floor(0.45*colW/(0.62*maxr))));
  const kanaF=Math.max(10,Math.min(cl(track*0.42,11,34), Math.floor(0.45*colW/maxk)));
  st.setProperty('--gap', gap+'px');
  st.setProperty('--noz',  noz+'px');
  st.setProperty('--kanaN',maxk);
  st.setProperty('--romaN',maxr);
  st.setProperty('--kanaF',kanaF+'px');
  st.setProperty('--romaF',romaF+'px');
  const cellMax=(colW-noz-0.62*romaF*maxr-18-3*(maxn-1))/maxn;
  let cellz=Math.max(12,Math.min(cl(track*0.80,22,48),Math.floor(cellMax)));
  st.setProperty('--cellz',cellz+'px');
  /* 見積りだけだとマスが列からはみ出すことがあるので、実測して詰める */
  for(let n=0;n<14 && cellz>12;n++){
    const over=[...grid.children].some(q=>q.scrollWidth>q.clientWidth+1);
    if(!over) break;
    cellz=Math.max(12,cellz-2);
    st.setProperty('--cellz',cellz+'px');
  }
  /* 同じ寸法を「ページに対する割合」でも用意しておく（印刷時はこちらを使う）。
     100vh = ページの内側の高さ、100vw = 同じく幅 */
  const pad=getComputedStyle(paper);
  const H=paper.clientHeight-parseFloat(pad.paddingTop)-parseFloat(pad.paddingBottom),
        W=paper.clientWidth -parseFloat(pad.paddingLeft)-parseFloat(pad.paddingRight);
  const vh=v=>(v/H*100).toFixed(3)+'vh', vw=v=>(v/W*100).toFixed(3)+'vw';
  st.setProperty('--gapP',  vh(gap));
  st.setProperty('--nozP',  vh(noz));
  st.setProperty('--kanaFP',vh(kanaF));
  st.setProperty('--romaFP',vh(romaF));
  st.setProperty('--cellzP',vh(cellz*0.97));   /* 印刷は少しだけ余裕を持たせる */
  st.setProperty('--baseP', vh(14));
  const nmEl=paper.querySelector('.ph .nm');
  st.setProperty('--nmWP',  vw(nmEl?nmEl.offsetWidth:80*MM));
  st.setProperty('--nmHP',  vh(9*MM));
  st.setProperty('--nmFlP', vh(13*MM));

  const nt=document.getElementById('note');
  const fl=track*0.86;
  const warn = fl < 9*MM
    ? `この問題数だと4線が約${(fl/MM).toFixed(1)}mmになります。問題数をへらすか、大きい用紙に（実際に刷る紙と同じものを選んでください）。` : '';
  nt.textContent=[state._note,warn].filter(Boolean).join(' ');
  squeeze();
  scaleView();
  return track>=30;      /* 段が低すぎるときは列を増やして組み直す */
}
function cells(n){ return `<div class="cells">${'<div class="cell"></div>'.repeat(n)}</div>`; }

/* ============ 紙面を作る ============ */
function scopeLabel(){
  const r=[...state.rows].join('・')+'行';
  const ex=[state.daku?'濁音':'',state.you?'拗音':'',state.soku?'っ':''].filter(Boolean).join('・');
  return r+(ex?'／'+ex:'')+'　訓令式';
}
function build(reuse){
  const n=state.count;
  const p = pool();
  const stale = !reuse || state.items.length!==n || !state.items.every(w=>p.indexOf(w)>=0);
  if(stale) state.items = pick(n);
  const words = state.items;
  state._note =
    !p.length ? 'この範囲でつくれる語がありません。行をふやしてください。'
    : p.length < n ? `この範囲でつくれる語は${p.length}語です。同じ語がくり返し出ます。` : '';
  document.getElementById('note').textContent = state._note;

  const prac = n<=10;
  /* 答えプリントはヘボン式も併記するので横幅が要る。たて用紙は1列、
     よこ用紙は2列（3列だと1ページに入りきらない） */
  const cols = prac ? 1
    : state.level==='answer'
      ? (n<=10 ? 1
         : PAPERS[state.paper][3]>=3 ? 2
         : n<=25 ? 1 : PAPERS[state.paper][3])
    : PAPERS[state.paper][3];
  const mode = state.level==='answer' ? 'answer'
            : state.level==='trace' ? 'trace'
            : state.level==='first' ? 'first' : 'blank';

  let qs='';
  words.forEach((w,i)=>{
    const ro = toRomaji(w, state.hepburn);
    const alt = toRomaji(w, !state.hepburn);
    const kind = state.kind==='both' ? (i%2===0?'read':'write') : state.kind;
    const no=`<div class="no">${i+1}</div>`;
    if(kind==='read'){
      const a = state.level==='answer' ? `<span class="kana" style="color:var(--base)">${w}</span>` : cells(tokenize(w).length);
      qs += `<div class="q">${no}<span class="roma">${ro}</span>${a}</div>`;
    }else{
      const extra = (state.level==='answer' && alt!==ro) ? `<span class="alt">(${alt})</span>` : '';
      qs += `<div class="q">${no}<span class="kana">${w}</span>${fourLine(ro, mode)}${extra}</div>`;
    }
  });

  const render = (c) => { document.getElementById('paper').innerHTML = `
   <div class="ph">
     <div class="ttl">
       <h2>ローマ字 ${prac?'れんしゅう':'テスト'}</h2>
       <div class="scope">${scopeLabel()}</div>
     </div>
     <div class="nm">
       <div class="nmrow"><span class="cap">なまえ</span><div class="nmjp"></div></div>
       <div class="nmrow"><span class="cap">ローマ字</span>${fourLine('','blank')}</div>
     </div>
   </div>
   <div class="meta"><div>くみ　　　</div><div>ばん　　　</div><div>月　　日</div></div>
   <div class="grid c${c}" data-cols="${c}" data-maxn="${Math.max(2,...words.map(w=>tokenize(w).length))}" data-maxr="${Math.max(4,...words.map(w=>toRomaji(w,state.hepburn).length))}" data-maxk="${Math.max(3,...words.map(w=>w.length))}">${qs}</div>
   ${state.level==='answer' ? '<div class="rule">※出題は訓令式。（　）内はヘボン式で、どちらで書いてあっても正解とします。</div>' : ''}
   <div class="foot">訓令式／${PAPERS[state.paper][0]}／お助け：${({normal:'なし',first:'1文字目うすじ',trace:'ぜんぶうすじ',answer:'こたえ'})[state.level]}</div>`; };
  /* 行をいちばん低くしても1ページに入らないときは、列を増やして組み直す */
  for(let c=cols, maxc=Math.max(cols,PAPERS[state.paper][3]); c<=maxc; c++){
    render(c);
    if(fit() || c===maxc) break;
  }
}

/* ============ UI ============ */
function mk(host, list, isOn, onTap){
  const el=document.getElementById(host); el.innerHTML='';
  list.forEach(o=>{
    const b=document.createElement('button');
    b.className='chip'+(isOn(o.v)?' on':''); b.textContent=o.t;
    b.onclick=()=>{onTap(o.v);draw();build(true);};
    el.appendChild(b);
  });
}
function draw(){
  mk('rows',[...Object.keys(ROWS).map(r=>({t:r,v:r})),{t:'ぜんぶ',v:'*'}],
     v=>v==='*'?state.rows.size===11:state.rows.has(v),
     v=>{ if(v==='*'){ state.rows = state.rows.size===11 ? new Set(['あ']) : new Set(Object.keys(ROWS)); }
          else { state.rows.has(v)?state.rows.delete(v):state.rows.add(v); if(!state.rows.size) state.rows.add(v); } });
  mk('extras',[{t:'濁音・半濁音',v:'daku'},{t:'拗音（ゃゅょ）',v:'you'},{t:'小さい っ',v:'soku'}],
     v=>state[v], v=>state[v]=!state[v]);
  mk('kinds',[{t:'よみ',v:'read'},{t:'かき',v:'write'},{t:'りょうほう',v:'both'}],
     v=>state.kind===v, v=>state.kind=v);
  mk('papers',Object.keys(PAPERS).map(k=>({t:PAPERS[k][0],v:k})),
     v=>state.paper===v, v=>{state.paper=v;applyPaper();});
  mk('counts',[{t:'5もん',v:5},{t:'10もん',v:10},{t:'25もん',v:25},{t:'50もん',v:50}],
     v=>state.count===v, v=>state.count=v);
  mk('levels',[{t:'つうじょう',v:'normal'},{t:'1文字目うすじ',v:'first'},{t:'ぜんぶうすじ',v:'trace'},{t:'こたえ',v:'answer'}],
     v=>state.level===v, v=>state.level=v);
}
document.getElementById('again').onclick=()=>build(false);
document.getElementById('print').onclick=()=>window.print();
window.addEventListener('resize', ()=>{scaleView();});
applyPaper(); draw(); build(false);
/* 書体が確定してから字幅が変わるので、一度だけ組み直す */
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>build(true));
</script>
</body>
</html>
